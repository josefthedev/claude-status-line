# ~/.claude/statusline.conf
# Claude Code Status Line Configuration
# Changes take effect on the next prompt — no restart needed.
#
# Per-project override: create .claude/statusline.conf in your project root
# to override any of these settings for that project only.
#
# ─────────────────────────────────────────────────────────
# CLAUDE CODE RENDERING BEHAVIOR
# ─────────────────────────────────────────────────────────
# Claude Code renders its own dynamic content alongside our output:
# - LINE1: CC appends a right-side suffix ("Remote Control active",
#   session info). Keep LINE1 short enough to leave room for it.
# - A CC UI line (permissions mode, shell count) is rendered on one
#   of the terminal rows, overwriting whatever our script put there.
#
# To prevent garbling, set CC_UI_LINE to the row number CC uses for
# its UI. Our script inserts a blank line at that position so CC
# overlays the blank instead of our content. Default: 2 (CC renders
# permissions on the row right after LINE1).

# ─────────────────────────────────────────────────────────
# LAYOUT
# ─────────────────────────────────────────────────────────
# Up to 3 lines, each a space-separated list of segment names.
# Set to "" to disable a line.
#
# Available segments:
#   model          Model display name  (e.g. "Claude Sonnet 4.6")
#   context_pct    Context window % used
#   tokens         Session token count (cumulative input + output)
#   cost           Estimated session cost
#   cache_pct      Cache-hit percentage (high = good / more savings)
#   effort         Effort level (low / medium / high / max / auto)
#   cwd            Current working directory (basename only)
#   git_branch     Git branch name
#   git_status     Git counts: ↑ahead ↓behind +staged ~unstaged
#   worktree       Shows indicator when inside a linked git worktree
#   rate_5h        5-hour API rate-limit usage (bar + %)
#   rate_7d        7-day API rate-limit usage (bar + %)
#   avg_tokens     Avg tokens/msg this session + % of all-session avg
#   session_timer  Elapsed session time (shown after first minute)
#   exhaust_5h     Projected time until 5-hour quota is exhausted
#   exhaust_7d     Projected time until 7-day quota is exhausted
#   downtime       Predicted locked-out window if 5h quota hits 100%
#   hook           Last hook event — compact: "Bash (gsd,m0,bridge)"
#   hookify_rule   Matched hookify rule count (only shown when rules match)
#   agents         Active/completed subagents (from agent-tracker hook)
#   plugins        Enabled MCP plugin count from settings.json
#   gsd_phase      GSD phase number + % from .planning/STATE.md
#   gsd_progress   GSD completed/total phases and plans
#
LINE1="model effort context_pct cache_pct tokens cwd git_branch git_status"
LINE2="hook hookify_rule agents rate_5h rate_7d avg_tokens"
LINE3="exhaust_5h exhaust_7d downtime session_timer gsd_phase gsd_progress"

# ─────────────────────────────────────────────────────────
# RATE LIMIT STYLE
# ─────────────────────────────────────────────────────────
# bar_pct  →  5h ▓▓░░░░ 12% 4h32m
# pct      →  5h 12% 4h32m
# bar      →  5h ▓▓░░░░
# off      →  (hidden)
RATE_STYLE="bar_pct"

# Width of the visual bar in characters
BAR_WIDTH=6

# ─────────────────────────────────────────────────────────
# TOKEN STYLE
# ─────────────────────────────────────────────────────────
# total   →  tokens: 42.1k
# in_out  →  tokens: ↑38.4k ↓3.7k
TOKEN_STYLE="in_out"

# ─────────────────────────────────────────────────────────
# DISPLAY OPTIONS
# ─────────────────────────────────────────────────────────
# Show segment labels ("tokens:", "cache:", "effort:", etc.)
SHOW_LABELS=true

# Show rate-limit reset countdown (e.g. "4h32m")
SHOW_TTL=true

# Separator character between segments on the same line
SEP_CHAR="│"

# Claude Code UI line — row where CC renders its permissions/mode
# indicator. Our script inserts a blank line here so CC doesn't
# garble our content. Set to 0 to disable (no blank line inserted).
CC_UI_LINE=0

# Max git branch name length before truncating with …
GIT_BRANCH_MAX=20

# ─────────────────────────────────────────────────────────
# COST ESTIMATION
# ─────────────────────────────────────────────────────────
# Prices are per million tokens (input output).
# Defaults match the current Anthropic public pricing.
# Override here if your plan differs.
# PRICE_OPUS="15 75"
# PRICE_SONNET="3 15"
# PRICE_HAIKU="0.80 4"

# ─────────────────────────────────────────────────────────
# PYTHON RENDERER SETTINGS
# ─────────────────────────────────────────────────────────
# These keys are used by statusline.py (the Python renderer).
# They have no effect on the bash statusline.sh.

# dimColor compensation — prefix each line with \033[22m to reset
# the dim attribute that Claude Code applies to statusline output.
# OVERRIDE_DIMCOLOR=true

# Maximum number of output lines (1–3). The Python renderer
# calculates per-line budgets as terminal_width // MAX_LINES.
# MAX_LINES=3
